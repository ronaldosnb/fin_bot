# Use alongside compose.dokploy-test.yaml and the VPS proxy.yaml.
# On the VPS, app.env contains only the app/worker runtime credentials.
services:
  panel-ip:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "72.60.63.41:8000:80"
    volumes:
      - ./panel-ip.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app: {condition: service_healthy}

  migrate:
    image: finbot-app:3de2467
    env_file: app.env
    command: alembic upgrade head
    depends_on:
      postgres: {condition: service_healthy}

  app:
    image: finbot-app:3de2467
    env_file: app.env
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - default
      - dokploy-network
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.finbot-panel-vps.rule: Host(`finbot-painel-72-60-63-41.sslip.io`) && (PathPrefix(`/admin`) || PathPrefix(`/static`) || Path(`/healthz`))
      traefik.http.routers.finbot-panel-vps.entrypoints: websecure
      traefik.http.routers.finbot-panel-vps.tls.certresolver: letsencrypt
      traefik.http.services.finbot-panel-vps.loadbalancer.server.port: "8000"

  worker:
    image: finbot-app:3de2467
    env_file: app.env
    restart: unless-stopped
    command: python -m app.worker
    depends_on:
      migrate: {condition: service_completed_successfully}

  evolution:
    environment:
      SERVER_URL: http://72.60.63.41:18081
      WEBHOOK_GLOBAL_URL: http://app:8000/webhook/evolution

networks:
  dokploy-network:
    external: true
