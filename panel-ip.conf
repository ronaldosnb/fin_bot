server {
    listen 80;
    server_name _;

    location = / {
        return 302 /admin;
    }

    location ~ ^/(admin(?:/|$)|static/|healthz$) {
        resolver 127.0.0.11 valid=10s;
        set $finbot_backend app:8000;
        proxy_pass http://$finbot_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        # HTTP access by IP needs a cookie without Secure. HTTPS keeps Secure.
        proxy_cookie_flags finbot_session nosecure httponly samesite=lax;
    }

    location / {
        return 404;
    }
}
